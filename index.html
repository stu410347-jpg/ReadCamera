<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>QR Code 掃描器</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 32px;
    }

    #reader {
      width: 100%;
      max-width: 600px;
      margin: auto;
    }

    #result {
      margin-top: 25px;
      font-size: 22px;
      font-weight: bold;
    }

    #sendForm {
      display: none;
    }

  </style>

</head>


<body>

  <h1>QR Code 掃描器</h1>

  <!-- QR Code 掃描器 -->
  <div id="reader"></div>

  <!-- 掃描結果 -->
  <div id="result">
    等待掃描...
  </div>


  <!--
    隱藏的表單
    用 POST 直接傳送到 Google Apps Script
  -->

  <form
    id="sendForm"
    method="POST"
    target="hiddenFrame">

    <input
      type="text"
      id="qrCodeInput"
      name="qrCode">

  </form>


  <!-- 隱藏 iframe -->
  <iframe
    name="hiddenFrame"
    id="hiddenFrame"
    style="display:none;">
  </iframe>


  <script>

    // ====================================
    // 你的 Google Apps Script 網址
    // ====================================

    const GAS_URL =
      "把你的GAS網址貼在這裡";


    // ====================================
    // QR Code 掃描成功
    // ====================================

    function onScanSuccess(decodedText, decodedResult) {

      // 顯示掃描結果

      document.getElementById("result").innerHTML =
        "掃描結果：" + decodedText +
        "<br><br>資料寫入中...";


      // 把 QR Code 放進表單

      document.getElementById("qrCodeInput").value =
        decodedText;


      // 設定 GAS 網址

      document.getElementById("sendForm").action =
        GAS_URL;


      // 使用 POST 傳送

      document.getElementById("sendForm").submit();


      // 顯示成功訊息

      setTimeout(function() {

        document.getElementById("result").innerHTML =
          "掃描結果：" + decodedText +
          "<br><br>✓ 已送出";

      }, 1000);


      // 停止掃描

      scanner.clear();

    }


    // ====================================
    // 掃描失敗
    // ====================================

    function onScanFailure(error) {

      // 不顯示錯誤
    }


    // ====================================
    // 啟動 QR Code 掃描器
    // ====================================

    const scanner =
      new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          }
        },

        false
      );


    scanner.render(
      onScanSuccess,
      onScanFailure
    );

  </script>

</body>

</html>
