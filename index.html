<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>條碼與 QR Code 掃描器</title>
  <!-- 導入開源掃描函式庫 Html5-QRCode -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }
    h2 {
      margin-bottom: 10px;
    }
    #reader {
      width: 90%;
      max-width: 500px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    #result-box {
      margin-top: 20px;
      padding: 15px 20px;
      width: 80%;
      max-width: 460px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }
    #scanned-result {
      font-weight: bold;
      color: #007bff;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <h2>條碼 / QR Code 掃描器</h2>
  
  <!-- 掃描畫面呈現區域 -->
  <div id="reader"></div>

  <!-- 掃描結果顯示區域 -->
  <div id="result-box">
    <p>掃描狀態：<span id="status">準備中...</span></p>
    <p>掃描結果：<span id="scanned-result">尚未掃描到內容</span></p>
  </div>

  <script>
    function onScanSuccess(decodedText, decodedResult) {
      // 成功掃描到內容時觸發
      document.getElementById('status').textContent = '掃描成功！';
      document.getElementById('status').style.color = 'green';
      document.getElementById('scanned-result').textContent = decodedText;
      console.log(`Scan result: ${decodedText}`, decodedResult);
    }

    function onScanFailure(error) {
      // 尋找條碼期間（未掃到）會持續觸發，可在此不作處理
    }

    // 初始化 HTML5 掃描元件
    let html5QrcodeScanner = new Html5QrcodeScanner(
      "reader",
      { 
        fps: 10,           // 每秒抓取幀數
        qrbox: { width: 250, height: 250 } // 掃描對焦框大小
      },
      /* verbose= */ false
    );

    // 啟動掃描器
    html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    document.getElementById('status').textContent = '請允許攝影機權限並對準條碼';
  </script>

</body>
</html>
